name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the control panel
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Settings → About
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version and operating system
      placeholder: Chrome 142, macOS 15
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
