name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested change
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This doesn't need network access, tracking or new permissions (or I've explained why it does).
