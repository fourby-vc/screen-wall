# Publishes the live demo (dev/build-demo.py) to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# Optional: Settings → Secrets and variables → Actions → Variables → STORE_URL = the Chrome Web Store
# link, which turns the banner's "Coming to the Chrome Web Store" into an "Add to Chrome" button.
name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the demo
        env:
          STORE_URL: ${{ vars.STORE_URL }}
        run: python3 dev/build-demo.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/demo
      - id: deployment
        uses: actions/deploy-pages@v4
